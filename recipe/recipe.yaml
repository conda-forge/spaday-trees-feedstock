context:
  version: "0.2.1"
  python_min: "3.11"

package:
  name: spaday-trees
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-trees/spaday_trees-${{ version }}.tar.gz
  sha256: ef5ebffcde2aea103334f4b7535f3dd9bf47d63fc1ac9a13892f927943e4f9b8

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.6.0

tests:
  - python:
      imports:
        - spaday_trees
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Trees, by Pierre, for spaday
  homepage: https://github.com/1kbgz/spaday-trees
  repository: https://github.com/1kbgz/spaday-trees

extra:
  recipe-maintainers:
    - timkpaine
